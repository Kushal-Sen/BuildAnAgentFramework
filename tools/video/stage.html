<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Whitebox stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root {
  --black: #0c0d10; --white: #fbfbf9; --ink: #16181d; --muted: #686c76; --line: #d9dade;
  --blue: #2a4bd7; --tint: #e7ebfb; --term: #101218; --term-ink: #e4e6ec; --term-dim: #5c6270;
  --display: "Bricolage Grotesque", Georgia, serif; --sans: "IBM Plex Sans", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1440px; height: 900px; overflow: hidden; }
#stage { position: relative; width: 1440px; height: 900px; background: var(--white); color: var(--ink); font-family: var(--sans); transition: background .6s, color .6s; }
#stage.dark { background: var(--black); color: var(--white); }
#mark { position: absolute; top: 34px; left: 56px; display: flex; gap: 12px; align-items: center; font: 500 19px var(--display); }
#mark i { width: 18px; height: 18px; border: 3px solid currentColor; display: block; }
#chapter { position: absolute; top: 36px; right: 56px; font: 400 18px var(--mono); opacity: .65; }
#scene { position: absolute; left: 56px; right: 56px; top: 84px; bottom: 138px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
#cap { position: absolute; left: 56px; right: 56px; bottom: 36px; min-height: 84px; display: flex; align-items: center; padding: 14px 26px; background: var(--ink); color: var(--white); font: 500 29px/1.3 var(--sans); }
#stage.dark #cap { background: var(--white); color: var(--ink); }
h1 { margin: 0; font: 700 56px/1.1 var(--display); letter-spacing: -.01em; }

.flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.flow div { min-height: 170px; display: flex; align-items: center; padding: 22px; border: 2px solid #4a4d57; font: 500 29px/1.25 var(--sans); opacity: .42; transition: all .35s; }
.flow div.on { opacity: 1; border-color: var(--white); background: var(--white); color: var(--ink); }
#stage:not(.dark) .flow div { border-color: var(--line); opacity: .55; }
#stage:not(.dark) .flow div.on { opacity: 1; border-color: var(--blue); background: var(--blue); color: #fff; }

.box-wrap { display: grid; place-items: center; gap: 30px; }
.box { position: relative; width: 430px; height: 430px; background: var(--white); border: 3px solid var(--white); overflow: hidden; display: grid; place-items: center; }
.box .inner { font: 600 25px/1.5 var(--mono); color: var(--ink); text-align: center; }
.door { position: absolute; top: 0; bottom: 0; width: 50%; background: #1c1e25; transition: transform 2s cubic-bezier(.7,0,.2,1); }
.door.l { left: 0; border-right: 1px solid #3a3d47; } .door.r { right: 0; }
.box.open .door.l { transform: translateX(-100%); } .box.open .door.r { transform: translateX(100%); }
.box-label { font: 700 46px var(--display); }

svg text { font-family: var(--sans); }
.n rect { fill: var(--white); stroke: var(--ink); stroke-width: 3; transition: all .3s; }
.n text { font-size: 28px; font-weight: 500; fill: var(--ink); text-anchor: middle; transition: fill .3s; }
.n.on rect { fill: var(--blue); stroke: var(--blue); } .n.on text { fill: #fff; }
.edge { fill: none; stroke: var(--ink); stroke-width: 3; marker-end: url(#a); }
.edge-label { font-size: 24px; fill: var(--muted); font-weight: 500; }

pre { margin: 0; font: 400 20px/1.36 var(--mono); }
.code { padding: 6px 0; }
.code span { display: block; padding: 0 14px; white-space: pre; opacity: 1; transition: all .25s; border-left: 5px solid transparent; }
.code.focus span { opacity: .3; }
.code.focus span.on { opacity: 1; background: var(--tint); border-left-color: var(--blue); }
.file { font: 400 19px var(--mono); color: var(--muted); }

.term { background: var(--term); color: var(--term-ink); padding: 28px 30px; min-height: 480px; font: 400 21px/1.6 var(--mono); }
.term.demo-output { min-height: 250px; padding: 18px 26px; font-size: 20px; line-height: 1.5; }
.term span { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
.term span.cmd { color: #9db1ff; } .term span.final { font-weight: 600; color: #fff; margin-top: 10px; }

table { border-collapse: collapse; width: 100%; font-size: 29px; }
th, td { text-align: left; padding: 15px 18px; border-bottom: 2px solid var(--line); }
th { font-size: 22px; color: var(--muted); font-weight: 500; }
td:first-child { font: 400 28px var(--mono); }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; opacity: .25; transition: opacity .4s; }
.notes.on { opacity: 1; } .notes div { background: var(--tint); padding: 18px 20px; font: 500 24px/1.3 var(--sans); }

.points { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 40px; font-size: 31px; }
.points div { border-top: 3px solid currentColor; padding-top: 14px; }
.next { font: 600 26px var(--mono); }
</style>
</head>
<body>
<div id="stage">
  <div id="mark"><i></i>Whitebox Academy</div>
  <div id="chapter"></div>
  <div id="scene"></div>
  <div id="cap"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const sleep = (secs) => new Promise((done) => setTimeout(done, secs * 1000));
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const LOOP = `<svg viewBox="0 0 1320 620" width="100%" height="100%">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#16181d"/></marker></defs>
  <path class="edge" d="M350 130 H500"/><path class="edge" d="M840 130 H980"/><path class="edge" d="M670 200 V380"/><path class="edge" d="M500 460 H175 V206"/>
  <text class="edge-label" x="890" y="115">No</text><text class="edge-label" x="688" y="300">Yes</text><text class="edge-label" x="240" y="445">Go round again</text>
  <g class="n" id="ask"><rect x="20" y="60" width="330" height="140"/><text x="185" y="140">Send to the model</text></g>
  <g class="n" id="check"><rect x="500" y="60" width="340" height="140"/><text x="670" y="140">Did it ask for a tool?</text></g>
  <g class="n" id="answer"><rect x="985" y="60" width="315" height="140"/><text x="1142" y="140">Final answer</text></g>
  <g class="n" id="tool"><rect x="500" y="385" width="340" height="140"/><text x="670" y="450">Run the tool,</text><text x="670" y="488">add the result</text></g>
</svg>`;

const render = {
  recap: (s) => `<h1>${s.title}</h1><div class="flow">${s.flow.map((f) => `<div>${f}</div>`).join("")}</div>`,
  box: (s) => `<div class="box-wrap"><div class="box"><div class="inner">${s.inner.join("<br>")}</div><i class="door l"></i><i class="door r"></i></div><div class="box-label">${s.label}</div></div>`,
  loop: () => LOOP,
  code: (s) => `<div class="file">${s.file}</div><pre class="code">${s.lines.map((l) => `<span>${esc(l) || " "}</span>`).join("")}</pre>`,
  term: () => `<div class="term"></div>`,
  demo: (s) => `<div class="file">${s.file}</div><pre class="code">${s.lines.map((l) => `<span>${esc(l) || " "}</span>`).join("")}</pre><div class="term demo-output"></div>`,
  scores: (s) => `<h1>${s.title}</h1><table><tr><th>Model</th><th>Original prompt</th><th>Longer prompt</th></tr>${s.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</table><div class="notes">${s.notes.map((n) => `<div>${n}</div>`).join("")}</div>`,
  end: (s) => `<h1>${s.title}</h1><div class="points">${s.points.map((p) => `<div>${p}</div>`).join("")}</div><div class="next">${s.next}</div>`,
};

const apply = {
  recap: (c) => document.querySelectorAll(".flow div").forEach((d, i) => d.classList.toggle("on", i <= c.focus)),
  box: (c) => { if (c.open) { $(".box").classList.add("open"); } },
  loop: (c) => document.querySelectorAll(".n").forEach((n) => n.classList.toggle("on", c.focus.includes(n.id))),
  code: (c, s) => {
    const pre = $(".code"); const rows = [...pre.children];
    pre.classList.toggle("focus", !!c.focus);
    rows.forEach((r) => r.classList.remove("on"));
    if (!c.focus) return;
    const from = s.lines.findIndex((l) => l.includes(c.focus[0]));
    let to = from;
    while (to < s.lines.length && !s.lines[to].includes(c.focus[1])) to++;
    rows.slice(from, to + 1).forEach((r) => r.classList.add("on"));
  },
  term: (c, s) => {
    $(".term").innerHTML = s.lines.slice(0, c.lines).map((l) => {
      const kind = l.startsWith("$") ? "cmd" : s.final && l.startsWith(s.final) ? "final" : "";
      return `<span class="${kind}">${esc(l) || " "}</span>`;
    }).join("");
  },
  demo: (c, s) => {
    apply.code(c, s);
    $(".term").innerHTML = s.outputLines.slice(0, c.lines).map((l) => `<span>${esc(l) || " "}</span>`).join("");
  },
  scores: (c) => $(".notes").classList.toggle("on", c.focus === "notes"),
  end: () => {},
};

window.start = async (data) => {
  $("#chapter").textContent = data.chapter;
  for (const scene of data.scenes) {
    const dark = scene.dark ?? (scene.type === "recap" || scene.type === "box");
    $("#stage").classList.toggle("dark", dark);
    $("#scene").innerHTML = render[scene.type](scene);
    for (const caption of scene.captions) {
      $("#cap").textContent = caption.text;
      apply[scene.type](caption, scene);
      if (caption.shot) setTimeout(() => { window.__shot = caption.shot; }, caption.secs * 700);
      await sleep(caption.secs);
    }
  }
  window.__done = true;
};
</script>
</body>
</html>
